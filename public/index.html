<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4FBFF">
  <title>AsmAI | Asistente Documentos IA de ASMAR</title>
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/estilos.css">
  <script>
    // Se aplica antes de pintar la página para que no parpadee: modo claro, salvo que el usuario haya elegido oscuro
    (function () {
      let tema = null;
      try { tema = localStorage.getItem("tema"); } catch (e) {}
      document.documentElement.dataset.tema = tema === "oscuro" ? "oscuro" : "claro";
    })();
  </script>
</head>
<body data-modo="inicio" data-menu="abierto">
  <div id="velo" class="velo"></div>

  <aside id="menu" class="menu">
    <div class="marca-menu">
      <img src="/asmar-mark.webp" alt="ASMAR">
      <div>
        <strong>AsmAI</strong>
        <small>Asistente documentos IA</small>
      </div>
    </div>

    <p class="etiqueta">Disponible</p>
    <nav id="temas" aria-label="Temas"></nav>

    <button id="btn-colapsar" class="icono" type="button" aria-label="Ocultar menú">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg>
    </button>
  </aside>

  <div class="principal">
    <header class="barra">
      <button id="btn-abrir" class="icono" type="button" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="espacio"></span>
      <button id="btn-nueva" class="enlace" type="button" hidden>Nueva consulta</button>
      <button id="btn-modo" class="icono modo" type="button" aria-label="Cambiar entre modo claro y oscuro">
        <svg class="luna" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </header>

    <section id="vista">
      <div id="inicio">
        <h1>Hola,</h1>
        <h2>¿en qué te puedo ayudar hoy?</h2>
        <p>Consulta documentos, normativas, etc. de Asmar</p>
        <div id="sugerencias"></div>
      </div>
      <div id="conversacion" hidden></div>
    </section>

    <footer class="dock">
      <form id="formulario" class="caja">
        <div class="fila-texto">
          <svg class="robot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3.5"/><path d="M12 8V4.5M9 13.5v1.5M15 13.5v1.5M2 13v3M22 13v3"/></svg>
          <textarea id="texto" rows="1" placeholder="Pregunta sobre todos los documentos o escribe una consulta..." enterkeyhint="send"></textarea>
        </div>
        <div class="acciones">
          <button id="btn-resumir" class="enlace" type="button">
            <svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/></svg>
            Resumir
          </button>
          <div class="envio">
            <span class="pista">Enter para enviar</span>
            <button id="btn-enviar" class="enviar" type="submit" aria-label="Enviar">
              <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </form>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
